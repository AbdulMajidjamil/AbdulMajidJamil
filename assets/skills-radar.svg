   .dot{opacity:0;animation:pop .01s 1.5s forwards}@keyframes pop{to{opacity:1}}
   @media (prefers-reduced-motion: reduce){.poly,.dot{opacity:1;transform:none;animation:none}}
 </style>
</defs>
