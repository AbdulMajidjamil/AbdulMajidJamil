<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="img">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.85"/>
      <stop offset="1"   stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <line x1="0" y1="12" x2="900" y2="12" stroke="url(#dl)" stroke-width="1.4"/>
  <g fill="#1b3a5b">
    <rect x="120" y="9" width="2" height="6"/><rect x="260" y="9" width="2" height="6"/>
    <rect x="450" y="8" width="2" height="8"/><rect x="640" y="9" width="2" height="6"/>
    <rect x="780" y="9" width="2" height="6"/>
  </g>
  <circle cx="0" cy="12" r="3.5" fill="#67E8F9" filter="url(#dg)">
    <animate attributeName="cx" values="40;860;40" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="0" cy="12" r="2" fill="#FF2D55" filter="url(#dg)">
    <animate attributeName="cx" values="860;40;860" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
