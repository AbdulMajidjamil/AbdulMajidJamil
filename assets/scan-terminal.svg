<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372" role="img"
     font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1526"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233d"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="scanl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <filter id="tg" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .ln{opacity:0;}
      .l1{animation:app .01s .3s forwards}  .l2{animation:app .01s .7s forwards}
      .l3{animation:app .01s 1.1s forwards} .l4{animation:app .01s 1.5s forwards}
      .l5{animation:app .01s 1.9s forwards} .l6{animation:app .01s 2.3s forwards}
      .l7{animation:app .01s 2.7s forwards} .l8{animation:app .01s 3.1s forwards}
      .l9{animation:app .01s 3.5s forwards}
      @keyframes app{to{opacity:1}}
      .cur{animation:bl 1.05s steps(1) 3.6s infinite}
      @keyframes bl{0%,50%{opacity:1}51%,100%{opacity:0}}
      @media (prefers-reduced-motion: reduce){.ln{opacity:1}.cur{opacity:1;animation:none}}
    </style>
  </defs>

  <!-- window -->
  <rect x="2" y="2" width="776" height="368" rx="12" fill="url(#win)" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect x="2" y="2" width="776" height="34" rx="12" fill="url(#bar)"/>
  <rect x="2" y="24" width="776" height="12" fill="url(#bar)"/>
  <circle cx="24" cy="19" r="6" fill="#FF5F57"/>
  <circle cx="46" cy="19" r="6" fill="#FEBC2E"/>
  <circle cx="68" cy="19" r="6" fill="#28C840"/>
  <text x="390" y="23" text-anchor="middle" font-size="12.5" fill="#7d8fb3" letter-spacing="1">majid@soc: ~/profile — bash</text>

  <!-- body -->
  <g font-size="14.5" letter-spacing="0.3">
    <text class="ln l1" x="22" y="66"  fill="#67E8F9" filter="url(#tg)">$ sudo ./init_profile.sh --verbose</text>

    <g class="ln l2"><text x="22" y="98"  fill="#34D399">[✓]</text><text x="58" y="98"  fill="#94a3b8">identity ......</text><text x="196" y="98" fill="#E2E8F0">Abdul Majid Jamil</text></g>
    <g class="ln l3"><text x="22" y="124" fill="#34D399">[✓]</text><text x="58" y="124" fill="#94a3b8">role .........</text><text x="196" y="124" fill="#E2E8F0">IT Security Specialist @ SICVD</text></g>
    <g class="ln l4"><text x="22" y="150" fill="#34D399">[✓]</text><text x="58" y="150" fill="#94a3b8">founder ......</text><text x="196" y="150" fill="#22D3EE">Pakistan Cyber Security &amp; Digital Forensics</text></g>
    <g class="ln l5"><text x="22" y="176" fill="#34D399">[✓]</text><text x="58" y="176" fill="#94a3b8">focus ........</text><text x="196" y="176" fill="#E2E8F0">VAPT · DFIR · SOC/SIEM · Ethical Hacking</text></g>
    <g class="ln l6"><text x="22" y="202" fill="#34D399">[✓]</text><text x="58" y="202" fill="#94a3b8">research .....</text><text x="196" y="202" fill="#E2E8F0">IEEE · ICMAR · ICSIS · ICFAR · ICTAR</text></g>
    <g class="ln l7"><text x="22" y="228" fill="#34D399">[✓]</text><text x="58" y="228" fill="#94a3b8">education ....</text><text x="196" y="228" fill="#E2E8F0">MS CS · PGD Cyber Security (NED) · BE Telecom</text></g>
    <g class="ln l8"><text x="22" y="254" fill="#34D399">[✓]</text><text x="58" y="254" fill="#94a3b8">mission ......</text><text x="196" y="254" fill="#FF2D55">Build a safer digital ecosystem</text></g>

    <g class="ln l9">
      <text x="22" y="296" fill="#67E8F9">$ status --now</text>
      <text x="22" y="322" fill="#94a3b8">&gt; <tspan fill="#34D399" font-weight="bold">ONLINE</tspan> — open to research, training &amp; security consulting</text>
      <rect class="cur" x="574" y="311" width="9" height="15" fill="#34D399"/>
    </g>
  </g>

  <!-- moving scan sheen -->
  <rect x="2" y="36" width="776" height="46" fill="url(#scanl)" opacity="0.8">
    <animate attributeName="y" values="36;300;36" dur="5.5s" repeatCount="indefinite"/>
  </rect>
</svg>
